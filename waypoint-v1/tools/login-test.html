<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WayPoint — Login Test</title>
<style>
  :root { --ink900:#0f172a; --ink500:#64748b; --ink200:#e2e8f0; --brand600:#4338ca;
          --success:#16a34a; --successBg:#f0fdf4; --danger:#dc2626; --dangerBg:#fef2f2; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #f8fafc; color: var(--ink900); display: flex; justify-content: center;
         padding: 48px 16px; margin: 0; }
  .card { background: #fff; border: 1px solid var(--ink200); border-radius: 12px;
          box-shadow: 0 4px 12px rgba(15,23,42,0.08); padding: 28px; width: 100%; max-width: 440px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--ink500); margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 9px 12px; font-size: 14px; border: 1px solid var(--ink200);
          border-radius: 8px; margin-bottom: 14px; font-family: inherit; }
  button { width: 100%; padding: 10px 18px; font-size: 14px; font-weight: 600; color: #fff;
           background: var(--brand600); border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .result { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 13px;
            white-space: pre-wrap; word-break: break-word; display: none; }
  .result.ok { display: block; background: var(--successBg); color: var(--success); }
  .result.err { display: block; background: var(--dangerBg); color: var(--danger); }
  .field { font-size: 12px; color: var(--ink500); margin: 2px 0; }
  .field b { color: var(--ink900); }
  .hint { font-size: 12px; color: var(--ink500); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>WayPoint — Login Test</h1>
    <p class="sub">Confirms sign-in works end to end against the deployed site, before wiring up anything else.</p>

    <label for="siteUrl">Site URL</label>
    <input id="siteUrl" placeholder="https://your-project.vercel.app" />

    <label for="email">Email</label>
    <input id="email" type="email" />

    <label for="password">Password</label>
    <input id="password" type="password" />

    <button id="runBtn">Test Login</button>

    <div id="result" class="result"></div>

    <p class="hint">
      Decodes the returned token locally to show its contents — this page never sends the
      token anywhere else.
    </p>
  </div>

<script>
  const siteUrlInput = document.getElementById('siteUrl');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const runBtn = document.getElementById('runBtn');
  const resultEl = document.getElementById('result');

  siteUrlInput.value = localStorage.getItem('waypoint_site_url') || '';

  function decodeJwtPayload(token) {
    const payload = token.split('.')[1];
    const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(atob(base64));
  }

  runBtn.addEventListener('click', async () => {
    const siteUrl = siteUrlInput.value.trim().replace(/\/$/, '');
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    resultEl.className = 'result';
    resultEl.textContent = '';

    if (!siteUrl || !email || !password) {
      resultEl.className = 'result err';
      resultEl.textContent = 'Fill in the site URL, email, and password.';
      return;
    }

    localStorage.setItem('waypoint_site_url', siteUrl);
    runBtn.disabled = true;
    runBtn.textContent = 'Signing in…';

    try {
      const res = await fetch(`${siteUrl}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const body = await res.json();

      if (!res.ok) {
        resultEl.className = 'result err';
        resultEl.textContent = body.error || `Request failed (${res.status})`;
        return;
      }

      const claims = decodeJwtPayload(body.token);
      resultEl.className = 'result ok';
      resultEl.innerHTML =
        `<div class="field"><b>Signed in.</b></div>` +
        `<div class="field">Role: <b>${claims.role}</b></div>` +
        `<div class="field">Tenant: <b>${claims.tenantId ?? '(none — PlatformAdmin)'}</b></div>` +
        `<div class="field">User id: <b>${claims.sub}</b></div>` +
        `<div class="field">Expires: <b>${new Date(claims.exp * 1000).toLocaleString()}</b></div>`;
    } catch (err) {
      resultEl.className = 'result err';
      resultEl.textContent = `Network error: ${err.message}\n\nCheck the site URL is correct and the deployment is live.`;
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = 'Test Login';
    }
  });
</script>
</body>
</html>
