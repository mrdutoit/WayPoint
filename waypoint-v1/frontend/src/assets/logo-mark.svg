<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.5 17.5 125 81" width="125" height="81" role="img" aria-label="WayPoint">
  <defs>
    <linearGradient id="g" x1="18" y1="0" x2="130" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="52%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="13" stroke-linejoin="round">
    <!-- W: full zigzag, round caps -->
    <polyline points="18,24 36,92 54,50 72,92 90,24" stroke-linecap="round"/>
    <!-- P: stem + single bowl, square cap -->
    <path d="M100,92 L100,24 L118,24 Q130,24 130,36 L130,46 Q130,58 118,58 L100,58" stroke-linecap="square"/>
  </g>
</svg>
